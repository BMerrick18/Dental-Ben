name: Build Image

on:
  push:
  pull_request:

# Every job can read the repository. Extra permissions are granted
# only on the job that needs them.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Download the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Check Python packages for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Test
        run: pytest

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets this job save the image in GitHub Container Registry.
      packages: write
      # Lets this job store the reusable build cache.
      actions: write
    steps:
      - name: Download the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/bmerrick18/dental-ben:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/bmerrick18/dental-ben:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Smoke test the image
        run: |
          docker run -d --name dental-ben -p 8000:8000 ghcr.io/bmerrick18/dental-ben:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              docker rm -f dental-ben
              exit 0
            fi
            sleep 1
          done
          echo "The container did not answer /health"
          docker logs dental-ben
          docker rm -f dental-ben
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/bmerrick18/dental-ben:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

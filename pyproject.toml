[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dental-ben"
version = "0.1.0"
description = "Dental-Ben Python project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
dental-ben = "dental_ben.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dental_ben"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
